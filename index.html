<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>系统分析师刷题</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="刷题">
<meta name="theme-color" content="#2563eb">
<style>
  :root {
    --bg:#f5f6f8; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
    --accent:#2563eb; --accent-soft:#eff6ff;
    --green:#16a34a; --green-soft:#f0fdf4; --green-border:#bbf7d0;
    --red:#dc2626; --red-soft:#fef2f2; --red-border:#fecaca;
    --border:#e5e7eb; --track:#eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f1115; --card:#181c24; --text:#e5e7eb; --muted:#98a1ad;
      --accent:#4f8df9; --accent-soft:#1c2740;
      --green:#34c26b; --green-soft:#122417; --green-border:#1e3b27;
      --red:#f0655f; --red-soft:#2a1417; --red-border:#4b1d22;
      --border:#272d38; --track:#242a36;
    }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    padding-bottom:calc(66px + env(safe-area-inset-bottom));
    touch-action:manipulation;
  }
  header {
    position:sticky; top:0; z-index:9;
    background:var(--card); border-bottom:1px solid var(--border);
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  }
  .htitle { font-size:17px; font-weight:700; }
  .hsub { font-size:12px; color:var(--muted); margin-top:2px; }
  main { max-width:640px; margin:14px auto 0; padding:0 14px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px;
          padding:16px; margin-bottom:14px; }
  h2 { font-size:15px; margin:0 0 10px; }
  .muted { color:var(--muted); font-size:13px; }
  .hidden { display:none !important; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .grow { flex:1; }
  .center { text-align:center; }
  .chip { display:inline-block; font-size:12px; color:var(--accent);
          background:var(--accent-soft); border-radius:999px; padding:2px 10px; }
  .chip.red { color:var(--red); background:var(--red-soft); }
  .chip.green { color:var(--green); background:var(--green-soft); }

  /* 控件 */
  select, button.btn, textarea {
    font-size:15px; padding:9px 12px; border-radius:10px;
    border:1px solid var(--border); background:var(--card); color:var(--text);
  }
  button.btn { min-height:40px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button.danger { color:var(--red); border-color:var(--red-border); }
  button.big { width:100%; min-height:48px; font-size:16px; }
  button:disabled { opacity:.5; }
  textarea { width:100%; min-height:90px; font-size:13px; }

  /* 首页统计块 */
  .tiles { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px; }
  .tile { background:var(--card); border:1px solid var(--border); border-radius:14px;
          text-align:center; padding:14px 6px; }
  .tile .num { font-size:26px; font-weight:700; }
  .tile .lbl { font-size:12px; color:var(--muted); margin-top:3px; }

  /* 考点行 */
  .crow { padding:11px 0; border-bottom:1px solid var(--border); }
  .crow:last-child { border-bottom:none; }
  .crow .l1 { display:flex; align-items:center; gap:8px; margin-bottom:7px; }
  .crow .l1 b { font-size:14.5px; }
  .crow .l1 .meta { font-size:12px; color:var(--muted); flex:1; }
  .bar { background:var(--track); border-radius:999px; height:8px; overflow:hidden; flex:1; }
  .bar > i { display:block; height:100%; background:var(--accent); border-radius:999px; }
  .bar.acc-high > i { background:var(--green); }
  .bar.acc-low > i { background:var(--red); }

  /* 题目 */
  .qhead { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .qtext { font-size:16.5px; line-height:1.75; white-space:pre-wrap; margin-bottom:14px; }
  .opt { display:flex; gap:11px; align-items:flex-start; width:100%; text-align:left;
         padding:13px 13px; margin-bottom:9px; border:1px solid var(--border);
         border-radius:12px; background:var(--card); color:var(--text);
         cursor:pointer; font-size:15px; line-height:1.6; min-height:48px; }
  .opt:disabled { cursor:default; }
  .opt .badge { flex:none; width:26px; height:26px; border-radius:8px; background:var(--track);
                color:var(--muted); display:flex; align-items:center; justify-content:center;
                font-size:13.5px; font-weight:600; margin-top:1px; }
  .opt.correct { border-color:var(--green); background:var(--green-soft); }
  .opt.correct .badge { background:var(--green); color:#fff; }
  .opt.wrong { border-color:var(--red); background:var(--red-soft); }
  .opt.wrong .badge { background:var(--red); color:#fff; }
  .opt.dim { opacity:.5; }
  .feedback { border-radius:12px; padding:13px 14px; margin-top:12px; font-size:14.5px; line-height:1.75; }
  .feedback.ok { background:var(--green-soft); border:1px solid var(--green-border); }
  .feedback.no { background:var(--red-soft); border:1px solid var(--red-border); }
  .feedback .explain { margin-top:8px; }
  .progress { color:var(--muted); font-size:13px; }
  .qfoot { display:flex; justify-content:flex-end; margin-top:12px; }
  .summary-big { font-size:34px; font-weight:700; text-align:center; margin:8px 0; }

  /* 列表条目 */
  .witem { padding:11px 0; border-bottom:1px solid var(--border); }
  .witem:last-child { border-bottom:none; }
  .wq { font-size:14.5px; line-height:1.65; }
  .wmeta { margin-top:6px; font-size:12.5px; color:var(--muted);
           display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .wmeta a { color:var(--accent); cursor:pointer; text-decoration:none; }
  .reveal { margin-top:8px; background:var(--bg); border:1px dashed var(--border);
            border-radius:10px; padding:10px; font-size:13.5px; line-height:1.75; }

  /* 底部标签栏 */
  .tabbar {
    position:fixed; left:0; right:0; bottom:0; z-index:9;
    display:flex; background:var(--card); border-top:1px solid var(--border);
    padding:6px 0 env(safe-area-inset-bottom);
  }
  .tabbar button {
    flex:1; background:none; border:none; color:var(--muted);
    display:flex; flex-direction:column; align-items:center; gap:2px;
    font-size:11px; padding:4px 0; cursor:pointer; position:relative;
  }
  .tabbar button .ticon { font-size:21px; line-height:1; }
  .tabbar button.active { color:var(--accent); }
  .tabbar .badge {
    position:absolute; top:0; left:calc(50% + 6px);
    background:var(--red); color:#fff; font-size:10px; font-style:normal;
    border-radius:999px; padding:1px 5px; min-width:16px;
  }
  ul.weaklist, ol.weaklist { margin:0; padding-left:20px; }
  ul.weaklist li, ol.weaklist li { margin-bottom:6px; font-size:14px; line-height:1.7; }

  /* 模考 */
  .mtimer { display:flex; align-items:center; gap:10px; background:var(--card);
            border:1px solid var(--border); border-radius:14px; padding:11px 13px;
            margin-bottom:12px; font-size:16px; font-weight:700;
            font-variant-numeric:tabular-nums; position:sticky; top:calc(52px + env(safe-area-inset-top)); z-index:8; }
  .mtimer .muted { font-weight:400; }
  .mtimer.warn { background:var(--red-soft); border-color:var(--red-border); color:var(--red); }
  .sheet { display:grid; grid-template-columns:repeat(auto-fill,minmax(40px,1fr)); gap:7px; }
  .sheet button { min-height:38px; border-radius:9px; border:1px solid var(--border);
                  background:var(--card); color:var(--muted); font-size:13px; cursor:pointer; }
  .sheet button.ans { background:var(--accent); border-color:var(--accent); color:#fff; }
  .sheet button.flag { border-color:#f59e0b; box-shadow:inset 0 -3px 0 #f59e0b; }
  .sheet button.cur { outline:2px solid var(--accent); outline-offset:1px; }
  .opt.sel { border-color:var(--accent); background:var(--accent-soft); }
  .opt.sel .badge { background:var(--accent); color:#fff; }
  .hist-row { display:flex; align-items:center; gap:10px; padding:9px 0;
              border-bottom:1px solid var(--border); font-size:13.5px; flex-wrap:wrap; }
  .hist-row:last-child { border-bottom:none; }
</style>
</head>
<body>
<header>
  <div class="htitle">📚 系统分析师刷题</div>
  <div class="hsub" id="hdr-sub">加载中…</div>
</header>

<main>
  <section id="view-home"></section>

  <section id="view-mock" class="hidden"></section>

  <section id="view-quiz" class="hidden">
    <div class="card hidden" id="resume-card">
      <div class="row">
        <span class="grow" id="resume-text" style="font-size:14px"></span>
        <button class="btn primary" onclick="resumeQuiz()">继续</button>
        <button class="btn" onclick="discardQuiz()">放弃</button>
      </div>
    </div>
    <div class="card" id="quiz-setup">
      <h2>开始一组题</h2>
      <div class="row" style="margin:10px 0">
        <select id="quiz-cat" class="grow" style="flex:2"></select>
        <select id="quiz-count">
          <option value="10">10 题</option>
          <option value="20" selected>20 题</option>
          <option value="30">30 题</option>
          <option value="0">全部</option>
        </select>
      </div>
      <div class="row">
        <label class="muted" style="font-size:14px"><input type="checkbox" id="quiz-shuffle" checked> 随机顺序</label>
        <span class="grow"></span>
        <button class="btn primary" onclick="startQuiz(false)">开始刷题</button>
      </div>
      <p class="muted" style="margin:10px 0 0">答题后立即显示解析;答错自动进入错题本。</p>
    </div>
    <div id="quiz-area"></div>
  </section>

  <section id="view-wrong" class="hidden"></section>
  <section id="view-stats" class="hidden"></section>
</main>

<nav class="tabbar">
  <button id="tab-home" class="active" onclick="switchTab('home')"><span class="ticon">🏠</span><span>首页</span></button>
  <button id="tab-quiz" onclick="switchTab('quiz')"><span class="ticon">📝</span><span>刷题</span></button>
  <button id="tab-mock" onclick="switchTab('mock')"><span class="ticon">🎯</span><span>模考</span></button>
  <button id="tab-wrong" onclick="switchTab('wrong')"><span class="ticon">❌</span><span>错题本</span><i class="badge hidden" id="wrong-badge">0</i></button>
  <button id="tab-stats" onclick="switchTab('stats')"><span class="ticon">📊</span><span>分析</span></button>
</nav>

<script src="data/bank.js"></script>
<script>
"use strict";
/* ================= 基础数据 ================= */
var BANK = window.BANK || [];
var QMAP = {};
BANK.forEach(function (q) { QMAP[q.id] = q; });
var CATS = [];
BANK.forEach(function (q) { if (CATS.indexOf(q.category) < 0) CATS.push(q.category); });
var STREAK_REMOVE = 2;   // 错题连续答对 N 次后自动移出错题本
var LS = { att: "rq_attempts", wrong: "rq_wrong", quiz: "rq_session", mock: "rq_mock", mockHist: "rq_mock_hist" };

var $ = function (s) { return document.querySelector(s); };
var esc = function (s) {
  return (s || "").replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
};
function loadJSON(key, fallback) {
  try { var v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; }
  catch (e) { return fallback; }
}
var attempts = loadJSON(LS.att, []);
var wrong = loadJSON(LS.wrong, {});
if (!attempts.length && attempts.constructor !== Array) attempts = [];
if (wrong.constructor !== Object) wrong = {};

function persist() {
  localStorage.setItem(LS.att, JSON.stringify(attempts));
  localStorage.setItem(LS.wrong, JSON.stringify(wrong));
}
function fmtNow() {
  var d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; };
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}

/* ================= 错题本逻辑(与旧版一致) ================= */
function updateWrong(qid, isCorrect) {
  var now = fmtNow();
  if (isCorrect) {
    if (wrong[qid]) {
      wrong[qid].streak++;
      wrong[qid].lastCorrectAt = now;
      if (wrong[qid].streak >= STREAK_REMOVE) { delete wrong[qid]; return true; }
    }
    return false;
  }
  if (wrong[qid]) {
    wrong[qid].n++; wrong[qid].streak = 0; wrong[qid].lastWrongAt = now;
  } else {
    wrong[qid] = { n: 1, streak: 0, lastWrongAt: now, lastCorrectAt: null };
  }
  return false;
}

/* ================= 统计 ================= */
function computeStats() {
  var catIdx = {}, cats = [];
  CATS.forEach(function (n, i) { catIdx[n] = i; cats.push({ name: n, total: 0, attempts: 0, correct: 0, accuracy: null, wrongLeft: 0 }); });
  BANK.forEach(function (q) { cats[catIdx[q.category]].total++; });
  var wrongChoice = {};
  attempts.forEach(function (a) {
    var q = QMAP[a.qid]; if (!q) return;
    var c = cats[catIdx[q.category]];
    c.attempts++; if (a.ok) c.correct++;
    if (!a.ok) {
      if (!wrongChoice[a.qid]) wrongChoice[a.qid] = {};
      wrongChoice[a.qid][a.choice] = (wrongChoice[a.qid][a.choice] || 0) + 1;
    }
  });
  cats.forEach(function (c) {
    if (c.attempts) c.accuracy = Math.round(100 * c.correct / c.attempts);
    c.wrongLeft = BANK.filter(function (q) { return q.category === c.name && wrong[q.id]; }).length;
  });
  var weak = cats.filter(function (c) { return c.accuracy !== null && c.attempts >= 5 && c.accuracy < 85; })
                 .sort(function (a, b) { return a.accuracy - b.accuracy; });
  var top = Object.keys(wrong).sort(function (a, b) { return wrong[b].n - wrong[a].n; }).slice(0, 12)
    .map(function (qid) {
      var q = QMAP[qid]; if (!q) return null;
      var wc = wrongChoice[qid] || {};
      return {
        id: qid, category: q.category, question: q.question,
        wrongCount: wrong[qid].n, streak: wrong[qid].streak,
        wrongChoices: Object.keys(wc).sort(function (a, b) { return wc[b] - wc[a]; })
                      .map(function (l) { return [l, wc[l]]; })
      };
    }).filter(Boolean);
  var totalCorrect = 0;
  attempts.forEach(function (a) { if (a.ok) totalCorrect++; });
  return {
    totalQuestions: BANK.length, totalAttempts: attempts.length, totalCorrect: totalCorrect,
    overallAccuracy: attempts.length ? Math.round(100 * totalCorrect / attempts.length) : null,
    wrongLeft: Object.keys(wrong).length, cats: cats, weak: weak, top: top
  };
}
function updateBadge() {
  var n = Object.keys(wrong).length, b = $("#wrong-badge");
  b.textContent = n;
  b.classList.toggle("hidden", !n);
  var acc = attempts.length ? Math.round(100 * attempts.reduce(function (s, a) { return s + (a.ok ? 1 : 0); }, 0) / attempts.length) + "%" : "—";
  $("#hdr-sub").textContent = BANK.length + " 题 · 累计作答 " + attempts.length + " · 正确率 " + acc + " · 待消灭错题 " + n;
}

/* ================= 标签切换 ================= */
function switchTab(name) {
  ["home", "quiz", "mock", "wrong", "stats"].forEach(function (t) {
    $("#tab-" + t).classList.toggle("active", t === name);
    $("#view-" + t).classList.toggle("hidden", t !== name);
  });
  if (name === "home") loadHome();
  if (name === "quiz") prepareQuizTab();
  if (name === "mock") renderMock();
  if (name === "wrong") loadWrong();
  if (name === "stats") loadStats();
  window.scrollTo(0, 0);
}

/* ================= 首页 ================= */
function tileHTML(num, lbl, color) {
  return '<div class="tile"><div class="num"' + (color ? ' style="color:' + color + '"' : '') + '>' + num +
         '</div><div class="lbl">' + lbl + "</div></div>";
}
function loadHome() {
  updateBadge();
  var s = computeStats();
  var accTxt = s.overallAccuracy === null ? "—" : s.overallAccuracy + "%";
  var weakHtml = "";
  if (s.weak.length) {
    weakHtml = '<div class="card"><h2>🎯 薄弱考点(建议优先)</h2><ul class="weaklist">' +
      s.weak.map(function (w) {
        return "<li>" + esc(w.name) + ' — 正确率 <b style="color:var(--red)">' + w.accuracy + "%</b>(已答 " + w.attempts +
          ' 次)<button class="btn" style="padding:4px 12px;font-size:12.5px;margin-left:6px" onclick="quickDrill(\'' + esc(w.name) + '\')">去刷</button></li>';
      }).join("") + "</ul></div>";
  }
  $("#view-home").innerHTML =
    '<div class="tiles">' +
      tileHTML(s.totalQuestions, "题库总数") +
      tileHTML(s.totalAttempts, "累计作答") +
      tileHTML(accTxt, "总正确率") +
      tileHTML(s.wrongLeft, "待消灭错题", s.wrongLeft ? "var(--red)" : "var(--green)") +
    "</div>" + weakHtml +
    '<div class="card"><h2>按考点练习</h2>' +
    s.cats.map(function (c) {
      var barCls = c.accuracy === null ? "" : (c.accuracy >= 80 ? "acc-high" : (c.accuracy < 60 ? "acc-low" : ""));
      var barW = c.accuracy === null ? 0 : c.accuracy;
      var acc = c.accuracy === null ? "未作答" : c.accuracy + "%";
      return '<div class="crow"><div class="l1"><b>' + esc(c.name) + "</b>" +
        '<span class="meta">' + c.total + " 题 · 已答 " + c.attempts +
        (c.wrongLeft ? ' · <span style="color:var(--red)">错 ' + c.wrongLeft + "</span>" : "") +
        '</span><span style="font-size:13px;color:var(--muted)">' + acc + "</span>" +
        '<button class="btn" style="padding:5px 14px;font-size:13px" onclick="quickDrill(\'' + esc(c.name) + '\')">练习</button></div>' +
        '<div class="bar ' + barCls + '"><i style="width:' + barW + '%"></i></div></div>';
    }).join("") + "</div>";
}
function fillCatSelect() {
  $("#quiz-cat").innerHTML = '<option value="全部">全部考点(随机混刷)</option>' +
    CATS.map(function (c) {
      var n = BANK.filter(function (q) { return q.category === c; }).length;
      return '<option value="' + esc(c) + '">' + esc(c) + "(" + n + " 题)</option>";
    }).join("");
}
function quickDrill(cat) {
  switchTab("quiz");
  var sel = $("#quiz-cat");
  for (var i = 0; i < sel.options.length; i++) if (sel.options[i].value === cat) sel.value = cat;
  startQuiz(false);
}

/* ================= 刷题 ================= */
var QUIZ = loadJSON(LS.quiz, null);

function saveSession() {
  if (QUIZ && !QUIZ.done) localStorage.setItem(LS.quiz, JSON.stringify(QUIZ));
  else localStorage.removeItem(LS.quiz);
}
function shuffleArr(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1)), t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function prepareQuizTab() {
  if (QUIZ && !QUIZ.done) {
    var valid = QUIZ.ids.filter(function (id) { return QMAP[id]; });
    if (valid.length && valid.length === QUIZ.ids.length) {
      $("#resume-text").textContent = "检测到未完成的练习:第 " + (QUIZ.idx + 1) + " / " + QUIZ.ids.length + " 题";
      $("#resume-card").classList.remove("hidden");
      $("#quiz-setup").classList.add("hidden");
      return;
    }
    QUIZ = null; saveSession();
  }
  $("#resume-card").classList.add("hidden");
  $("#quiz-setup").classList.remove("hidden");
}
function resumeQuiz() {
  $("#resume-card").classList.add("hidden");
  $("#quiz-setup").classList.add("hidden");
  QUIZ.answered = false;
  renderQuestion();
}
function discardQuiz() {
  QUIZ = null; saveSession();
  $("#resume-card").classList.add("hidden");
  $("#quiz-setup").classList.remove("hidden");
  $("#quiz-area").innerHTML = "";
}
function startQuiz(fromWrong, wrongCategory) {
  var ids;
  if (fromWrong) {
    var cat = wrongCategory || "全部";
    ids = Object.keys(wrong).filter(function (id) {
      return QMAP[id] && (cat === "全部" || QMAP[id].category === cat);
    });
    shuffleArr(ids);
    if (!ids.length) { alert("错题本里没有可选的题目"); return; }
    QUIZ = { ids: ids, idx: 0, answered: false, mode: "wrong", cat: cat, correct: 0, wrongList: [], done: false };
  } else {
    var c = $("#quiz-cat").value;
    var count = parseInt($("#quiz-count").value, 10);
    ids = BANK.filter(function (q) { return c === "全部" || q.category === c; }).map(function (q) { return q.id; });
    if ($("#quiz-shuffle").checked) shuffleArr(ids);
    if (count > 0) ids = ids.slice(0, count);
    if (!ids.length) { alert("没有可做的题目"); return; }
    QUIZ = { ids: ids, idx: 0, answered: false, mode: "practice", cat: c, correct: 0, wrongList: [], done: false };
  }

function choose(letter) {
  if (!QUIZ || QUIZ.done || QUIZ.answered) return;
  QUIZ.answered = true;
  var q = curQ();
  var isCorrect = letter === q.answer;
  attempts.push({ qid: q.id, choice: letter, ok: isCorrect ? 1 : 0, mode: QUIZ.mode, at: fmtNow() });
  var removed = updateWrong(q.id, isCorrect);
  QUIZ.correct += isCorrect ? 1 : 0;
  if (!isCorrect) QUIZ.wrongList.push({ id: q.id, your: letter, answer: q.answer });
  persist();

  Object.keys(q.options).forEach(function (l) {
    var el = document.getElementById("opt-" + l);
    if (l === q.answer) el.classList.add("correct");
    else if (l === letter) el.classList.add("wrong");
    else el.classList.add("dim");
    el.disabled = true;
  });
  var fb = $("#feedback");
  fb.className = "feedback " + (isCorrect ? "ok" : "no");
  var msg = isCorrect
    ? "✅ 回答正确,答案是 <b>" + q.answer + "</b>"
    : "❌ 回答错误,正确答案是 <b>" + q.answer + "</b>。本题已进入错题本";
  if (removed) msg += "<br>🎉 本题已连续答对 " + STREAK_REMOVE + " 次,自动移出错题本";
  else if (isCorrect && QUIZ.mode === "wrong" && wrong[q.id]) msg += "<br>(连对 1 次,再连对 1 次移出错题本)";
  msg += '<div class="explain"><b>解析:</b>' + esc(q.explanation || "") + "</div>";
  fb.innerHTML = msg;
  fb.classList.remove("hidden");
  var btn = $("#btn-next");
  btn.classList.remove("hidden");
  if (QUIZ.idx === QUIZ.ids.length - 1) btn.textContent = "查看结果";
  updateBadge();
  saveSession();
  fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

/* ================= 模拟考试 ================= */
var MOCK = loadJSON(LS.mock, null);
var MOCK_HIST = loadJSON(LS.mockHist, []);
var mockTimer = null;

function persistMock() {
  if (MOCK && !MOCK.done) localStorage.setItem(LS.mock, JSON.stringify(MOCK));

function papers() {

function renderMock() {

  }

    '<div class="row" style="margin:10px 0 4px"><b style="font-size:14px">限时</b><span class="grow"></span>' +
    '<select id="mock-dur"><option value="150">150 分钟(真实时长)</option><option value="90">90 分钟</option>' +

function startMockPaper(name) {
  var ps = papers();
  var p = null;
  ps.forEach(function (x) { if (x.name === name) p = x; });
  if (!p || !p.ids.length) { alert("该试卷暂无题目"); return; }
  launchMock(p.name, shuffleArr(p.ids.slice()));
}
function startMockSmart() {
  launchMock("智能模拟卷", smartDraw(75));
}
function launchMock(paper, ids) {
  if (!ids.length) { alert("没有可用的题目"); return; }
  var dur = $("#mock-dur") ? parseInt($("#mock-dur").value, 10) : 150;
  MOCK = { paper: paper, ids: ids, ans: {}, flags: [], idx: 0, startedAt: Date.now(), dur: isNaN(dur) ? 150 : dur, done: false };
  persistMock();
  renderMockRunning();
  startMockTimer();
}
function smartDraw(n) {
  var byCat = {};
  BANK.forEach(function (q) {
    if (!byCat[q.category]) byCat[q.category] = [];
    byCat[q.category].push(q.id);
  });
  var pools = Object.keys(byCat).map(function (c) { return shuffleArr(byCat[c].slice()); });
  var out = [], i = 0;
  while (out.length < n) {
    var added = false;
    for (var p = 0; p < pools.length && out.length < n; p++) {
      if (i < pools[p].length) { out.push(pools[p][i]); added = true; }
    }
    if (!added) break;
    i++;
  }
  return shuffleArr(out);
}
function renderMockRunning() {
  $("#view-mock").innerHTML =
    '<div class="mtimer" id="mock-timerbar"><span id="mock-timer">--:--</span>' +
    '<span class="muted grow" style="font-size:12.5px">' + esc(MOCK.paper) + "</span>" +
    '<button class="btn danger" style="padding:6px 14px;font-size:13px" onclick="submitMock(false)">交卷</button></div>' +
    '<div id="mock-q"></div>' +
    '<div class="card"><h2>答题卡</h2><div class="sheet" id="mock-sheet"></div>' +
    '<p class="muted" style="margin:9px 0 0">蓝底 = 已作答 · 底部橙条 = 已标记 · 再点一次已选选项可取消。点击数字跳题。</p></div>';
  renderMockQ();
}
function renderMockQ() {
  var q = QMAP[MOCK.ids[MOCK.idx]], total = MOCK.ids.length;
  $("#mock-q").innerHTML =
    '<div class="card"><div class="qhead"><span class="chip">' + esc(q.category) + "</span>" +
    (q.source ? '<span class="chip green">' + esc(q.source) + "</span>" : "") +
    '<span class="progress">' + (MOCK.idx + 1) + " / " + total + "</span></div>" +
    '<div class="qtext">' + esc(q.question) + "</div>" +
    Object.keys(q.options).map(function (l) {
      var sel = MOCK.ans[q.id] === l;
      return '<button class="opt' + (sel ? " sel" : "") + '" id="mopt-' + l + '" onclick="pickMock(\'' + l + '\')"><span class="badge">' + l + "</span><span>" + esc(q.options[l]) + "</span></button>";
    }).join("") +
    '<div class="row" style="margin-top:12px">' +
    '<button class="btn" style="flex:1" onclick="mockNav(-1)">上一题</button>' +
    '<button class="btn" style="flex:1" onclick="toggleFlag()">' + (MOCK.flags.indexOf(q.id) >= 0 ? "★ 已标记" : "☆ 标记") + "</button>" +
    '<button class="btn primary" style="flex:1" onclick="mockNav(1)">' + (MOCK.idx === total - 1 ? "去交卷 ⏎" : "下一题") + "</button>" +
    "</div></div>";
  renderSheet();
  window.scrollTo(0, 0);
}
function pickMock(l) {
  var q = QMAP[MOCK.ids[MOCK.idx]];
  if (MOCK.ans[q.id] === l) delete MOCK.ans[q.id];
  else MOCK.ans[q.id] = l;
  persistMock();
  renderMockQ();
}
function mockNav(d) {
  var n = MOCK.idx + d;
  if (n < 0) n = 0;
  if (n >= MOCK.ids.length) { submitMock(false); return; }
  MOCK.idx = n;
  persistMock();
  renderMockQ();
}
function toggleFlag() {
  var qid = MOCK.ids[MOCK.idx];
  var i = MOCK.flags.indexOf(qid);
  if (i >= 0) MOCK.flags.splice(i, 1); else MOCK.flags.push(qid);
  persistMock();
  renderMockQ();
}
function renderSheet() {
  $("#mock-sheet").innerHTML = MOCK.ids.map(function (id, i) {
    var cls = [];
    if (MOCK.ans[id]) cls.push("ans");
    if (MOCK.flags.indexOf(id) >= 0) cls.push("flag");
    if (i === MOCK.idx) cls.push("cur");
    return '<button class="' + cls.join(" ") + '" onclick="jumpMock(' + i + ')">' + (i + 1) + "</button>";
  }).join("");
}
function jumpMock(i) { MOCK.idx = i; persistMock(); renderMockQ(); }
function startMockTimer() {
  if (mockTimer) clearInterval(mockTimer);
  if (!MOCK || MOCK.done) return;
  tickMockTimer();
  mockTimer = setInterval(tickMockTimer, 1000);
}
function tickMockTimer() {
  if (!MOCK || MOCK.done) { if (mockTimer) clearInterval(mockTimer); return; }
  var t = document.getElementById("mock-timer");
  if (!t) return;
  if (MOCK.dur > 0) {
    var left = MOCK.startedAt + MOCK.dur * 60000 - Date.now();
    if (left <= 0) { t.textContent = "剩余 00:00"; submitMock(true); return; }
    var m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
    t.textContent = "剩余 " + (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
    var bar = document.getElementById("mock-timerbar");
    if (bar) bar.classList.toggle("warn", left < 5 * 60000);
  } else {
    var used = Date.now() - MOCK.startedAt;
    var um = Math.floor(used / 60000), us = Math.floor((used % 60000) / 1000);
    t.textContent = "已用 " + (um < 10 ? "0" : "") + um + ":" + (us < 10 ? "0" : "") + us;
  }
}
function submitMock(auto) {
  if (!MOCK || MOCK.done) return;
  var total = MOCK.ids.length;
  var answered = Object.keys(MOCK.ans).length;
  if (!auto) {
    var un = total - answered;
    if (!confirm(un > 0 ? "还有 " + un + " 题未作答,确定交卷吗?" : "确定交卷吗?")) return;
  }
  if (mockTimer) clearInterval(mockTimer);
  var score = 0;
  MOCK.ids.forEach(function (id) {
    var q = QMAP[id], pick = MOCK.ans[id];
    if (!pick) return;                       // 未作答不计入做题记录
    var ok = pick === q.answer;
    if (ok) score++;
    attempts.push({ qid: id, choice: pick, ok: ok ? 1 : 0, mode: "mock", at: fmtNow() });
    updateWrong(id, ok);
  });
  persist();
  var usedMin = Math.max(1, Math.round((Date.now() - MOCK.startedAt) / 60000));
  var need = Math.ceil(total * 0.6);
  var pass = score >= need;
  MOCK.done = true;
  persistMock();
  MOCK_HIST.unshift({ paper: MOCK.paper, score: score, total: total, pass: pass, date: fmtNow(), used: usedMin });
  MOCK_HIST = MOCK_HIST.slice(0, 30);
  localStorage.setItem(LS.mockHist, JSON.stringify(MOCK_HIST));
  renderMockResult(MOCK.paper, score, total, pass, need, usedMin, total - answered);
}
function renderMockResult(paper, score, total, pass, need, usedMin, unanswered) {
  var rows = MOCK.ids.map(function (id, i) {
    var q = QMAP[id], pick = MOCK.ans[id], ok = pick === q.answer;
    return '<div class="witem"><div class="wq">' + (i + 1) + ". " + esc(q.question) + "</div>" +
      '<div class="wmeta">' +
      '<span class="' + (!pick ? "chip" : ok ? "chip green" : "chip red") + '">' + (!pick ? "未作答" : "你的答案 " + pick) + "</span>" +
      (ok ? "" : '<span class="chip">正确答案 ' + q.answer + "</span>") +
      (q.source ? '<span class="muted">' + esc(q.source) + "</span>" : "") + "</div>" +
      '<div class="reveal" style="margin-top:8px"><b>解析:</b>' + esc(q.explanation || "") + "</div></div>";
  }).join("");
  $("#view-mock").innerHTML =
    '<div class="card center"><div class="summary-big">' + (pass ? "🎉" : "💪") + " " + score + " / " + total + "</div>" +
    '<div class="muted">' + esc(paper) + "</div>" +
    '<div class="row" style="justify-content:center;margin-top:10px">' +
    '<span class="' + (pass ? "chip green" : "chip red") + '">' + (pass ? "通过" : "未通过") + "(及格线 " + need + " 分)</span>" +
    '<span class="muted">用时约 ' + usedMin + " 分钟 · 未作答 " + unanswered + " 题</span></div>" +
    '<div class="row" style="justify-content:center;margin-top:16px">' +
    '<button class="btn primary" onclick="finishMock()">完成</button></div></div>' +
    '<div class="card"><h2>逐题回顾(错题已进错题本)</h2>' + rows + "</div>";
  updateBadge();
  window.scrollTo(0, 0);
}
function finishMock() { MOCK = null; persistMock(); renderMock(); }

/* ================= 键盘操作(桌面端) ================= */
document.addEventListener("keydown", function (e) {
  if (!$("#view-mock").classList.contains("hidden") && MOCK && !MOCK.done) {
    var mmap = { a: "A", b: "B", c: "C", d: "D", "1": "A", "2": "B", "3": "C", "4": "D" };
    var ml = mmap[e.key.toLowerCase()];
    if (ml) { pickMock(ml); return; }
    if (e.key === "Enter") { mockNav(1); return; }
    return;
  }
  if ($("#view-quiz").classList.contains("hidden") || !QUIZ || QUIZ.done) return;
  if (e.key === "Enter" || e.key === " ") {
    var btn = $("#btn-next");
    if (btn && !btn.classList.contains("hidden")) { e.preventDefault(); nextQ(); }
    return;
  }
  var map = { a: "A", b: "B", c: "C", d: "D", "1": "A", "2": "B", "3": "C", "4": "D" };
  var letter = map[e.key.toLowerCase()];
  if (letter && !QUIZ.answered) choose(letter);
});

/* ================= 启动 ================= */
fillCatSelect();
updateBadge();
loadHome();
prepareQuizTab();
if ("serviceWorker" in navigator &&
    (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
